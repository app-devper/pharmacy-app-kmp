name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (JVM + Android + WasmJs + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native dist (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml', '**/build.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Architecture audit
        run: ./gradlew :composeApp:auditArchitecture --stacktrace

      - name: JVM tests (4 core + 20 per-feature + shared/test-fixtures compile)
        run: |
          ./gradlew --parallel \
            :core:common:jvmTest \
            :core:domain:jvmTest \
            :core:ui:jvmTest \
            :core:data:jvmTest \
            :features:shared:compileKotlinJvm \
            :features:test-fixtures:compileKotlinJvm \
            :features:auth:jvmTest \
            :features:bulkimport:jvmTest \
            :features:customers:jvmTest \
            :features:expiry:jvmTest \
            :features:help:jvmTest \
            :features:imports:jvmTest \
            :features:ky:jvmTest \
            :features:labels:jvmTest \
            :features:movements:jvmTest \
            :features:offlinesync:jvmTest \
            :features:planning:jvmTest \
            :features:profile:jvmTest \
            :features:reports:jvmTest \
            :features:saleshistory:jvmTest \
            :features:sell:jvmTest \
            :features:settings:jvmTest \
            :features:stock:jvmTest \
            :features:stockcount:jvmTest \
            :features:suppliers:jvmTest \
            :features:users:jvmTest \
            --stacktrace

      - name: Android debug unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Compile WasmJs test target
        run: ./gradlew :composeApp:compileTestKotlinWasmJs --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/architecture-audit.txt
            **/build/test-results/
          retention-days: 7

  ios:
    name: macOS (iOS Simulator test compile)
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native dist (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml', '**/build.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Compile iOS Simulator (Arm64) test target
        run: ./gradlew :composeApp:compileTestKotlinIosSimulatorArm64 --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
