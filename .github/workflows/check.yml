name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # macOS is required for :composeApp:compileTestKotlinIosSimulatorArm64.
    # Linux runners can build everything except the iOS targets.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native dist (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml', '**/build.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Architecture audit
        run: ./gradlew :composeApp:auditArchitecture --stacktrace

      - name: JVM tests (all 6 modules)
        run: |
          ./gradlew \
            :core:common:jvmTest \
            :core:domain:jvmTest \
            :core:ui:jvmTest \
            :core:data:jvmTest \
            :features:jvmTest \
            :composeApp:jvmTest \
            --stacktrace

      - name: Android debug unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Compile iOS Simulator (Arm64) test target
        run: ./gradlew :composeApp:compileTestKotlinIosSimulatorArm64 --stacktrace

      - name: Compile WasmJs test target
        run: ./gradlew :composeApp:compileTestKotlinWasmJs --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/architecture-audit.txt
            **/build/test-results/
          retention-days: 7
