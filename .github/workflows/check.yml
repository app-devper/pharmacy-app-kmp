name: check

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (JVM + Android + WasmJs + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Audit + tests + coverage (single Gradle invocation)
        run: |
          ./gradlew --parallel \
            :composeApp:auditArchitecture \
            :core:common:jvmTest \
            :core:domain:jvmTest \
            :core:ui:jvmTest \
            :core:data:jvmTest \
            :features:test-fixtures:compileKotlinJvm \
            :features:auth:jvmTest \
            :features:bulkimport:jvmTest \
            :features:customers:jvmTest \
            :features:expiry:jvmTest \
            :features:help:jvmTest \
            :features:imports:jvmTest \
            :features:ky:jvmTest \
            :features:labels:jvmTest \
            :features:movements:jvmTest \
            :features:offlinesync:jvmTest \
            :features:planning:jvmTest \
            :features:profile:jvmTest \
            :features:reports:jvmTest \
            :features:saleshistory:jvmTest \
            :features:sell:jvmTest \
            :features:settings:jvmTest \
            :features:stock:jvmTest \
            :features:stockcount:jvmTest \
            :features:suppliers:jvmTest \
            :features:users:jvmTest \
            :composeApp:testDebugUnitTest \
            :composeApp:compileTestKotlinWasmJs \
            koverVerify \
            --stacktrace

      - name: Coverage report on failure (XML)
        if: failure()
        run: ./gradlew koverXmlReport --stacktrace

      - name: Upload test + coverage reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/architecture-audit.txt
            **/build/test-results/
            build/reports/kover/
          retention-days: 7
