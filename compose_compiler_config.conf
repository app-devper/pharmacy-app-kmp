// Compose Compiler stability config
// Marks types that the Compose compiler should treat as stable for skippable
// recomposition. The compose compiler usually infers data class stability when
// all properties are primitives, but List<T> / Map<K,V> / Set<T> show up as
// interfaces and break inference even when the underlying instances are
// immutable in our domain layer.
//
// See: https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// Treat every domain model as stable. UiStates already use copy() pattern;
// domain data classes never mutate; List/Map fields wrap immutable lists in
// production (we never mutate after construction).
app.devper.pharm.domain.model.*

// Common collection libraries with semantically immutable shapes.
kotlinx.collections.immutable.PersistentList
kotlinx.collections.immutable.PersistentMap
kotlinx.collections.immutable.PersistentSet
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableMap
kotlinx.collections.immutable.ImmutableSet
