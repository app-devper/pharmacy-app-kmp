<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.devper.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#080d14" media="(prefers-color-scheme: dark)">
    <title>PharmacyApp</title>
    <style>
        html { color-scheme: light dark; }
        html, body { margin: 0; padding: 0; width: 100%; min-width: 320px; height: 100%; background: #f9fafb; overflow: hidden; }
        body { overscroll-behavior: none; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #f9fafb;
            z-index: 10;
            transition: opacity 200ms ease-out;
        }
        #app-loading.done { opacity: 0; pointer-events: none; }
        #app-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #1B83D8;
            border-radius: 50%;
            animation: app-loading-spin 0.9s linear infinite;
        }
        #app-loading .brand {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: #111827;
        }
        #app-loading .hint {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
            font-size: 13px;
            color: #6b7280;
        }
        @keyframes app-loading-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            #app-loading { transition: none; }
            #app-loading .spinner { animation: none; border-top-color: #e5e7eb; }
        }
        @media (prefers-color-scheme: dark) {
            html, body, #app-loading { background: #080d14; }
            #app-loading .spinner { border-color: #263445; border-top-color: #64a9e8; }
            #app-loading .brand { color: #f4f7fb; }
            #app-loading .hint { color: #9aa7b7; }
        }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="spinner"></div>
        <div class="brand">Pharmacy POS</div>
        <div class="hint">กำลังโหลดแอป…</div>
    </div>
    <script src="composeApp.js"></script>
</body>
</html>
