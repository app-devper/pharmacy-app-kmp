#Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4G"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9: keep the Kotlin Gradle plugin in charge of Kotlin and the legacy DSL until the KMP modules move to com.android.kotlin.multiplatform.library (opt-out goes away in AGP 10)
android.builtInKotlin=false
android.newDsl=false
